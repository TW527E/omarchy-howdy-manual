name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libpam0g-dev python3 nodejs
      - name: Test without changing system authentication
        run: make test
